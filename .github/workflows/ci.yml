name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            ARCH="x86_64-linux"
          else
            ARCH="aarch64-macos"
          fi
          INDEX=$(curl -sL https://ziglang.org/download/index.json)
          URL=$(echo "$INDEX" | python3 -c "import sys,json; print(json.load(sys.stdin)['master']['$ARCH']['tarball'])")
          curl -sL "$URL" | tar -xJ
          echo "$(pwd)/$(ls -d zig-*)" >> $GITHUB_PATH

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      - name: Bench
        run: zig build bench
